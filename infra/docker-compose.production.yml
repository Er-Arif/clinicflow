services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - clinicflow_prod_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  backend:
    build:
      context: ../backend
    environment:
      CLINICFLOW_ENVIRONMENT: production
      CLINICFLOW_ALLOWED_HOSTS: ${CLINICFLOW_ALLOWED_HOSTS:?Set CLINICFLOW_ALLOWED_HOSTS as a JSON array}
      CLINICFLOW_CORS_ORIGINS: ${CLINICFLOW_CORS_ORIGINS:-[]}
      CLINICFLOW_TRUSTED_PROXY_IPS: '${CLINICFLOW_TRUSTED_PROXY_IPS:-["172.30.0.10/32"]}'
      CLINICFLOW_CLIENT_IP_SOURCE: socket
      CLINICFLOW_DB_POOL_SIZE: ${CLINICFLOW_DB_POOL_SIZE:-5}
      CLINICFLOW_DB_MAX_OVERFLOW: ${CLINICFLOW_DB_MAX_OVERFLOW:-5}
      CLINICFLOW_DB_POOL_TIMEOUT: ${CLINICFLOW_DB_POOL_TIMEOUT:-10}
      CLINICFLOW_DB_POOL_RECYCLE: ${CLINICFLOW_DB_POOL_RECYCLE:-1800}
      CLINICFLOW_DB_CONNECT_TIMEOUT: ${CLINICFLOW_DB_CONNECT_TIMEOUT:-5}
      CLINICFLOW_DATABASE_URL: ${CLINICFLOW_DATABASE_URL:?Set CLINICFLOW_DATABASE_URL}
      CLINICFLOW_CLINIC_TIMEZONE: ${CLINICFLOW_CLINIC_TIMEZONE:-Asia/Kolkata}
      CLINICFLOW_LOG_LEVEL: ${CLINICFLOW_LOG_LEVEL:-INFO}
      CLINICFLOW_API_PREFIX: /api/v1
      CLINICFLOW_ACCESS_TOKEN_SECRET: ${CLINICFLOW_ACCESS_TOKEN_SECRET:?Set CLINICFLOW_ACCESS_TOKEN_SECRET}
      CLINICFLOW_ACCESS_TOKEN_MINUTES: ${CLINICFLOW_ACCESS_TOKEN_MINUTES:-15}
      CLINICFLOW_REFRESH_SESSION_DAYS: ${CLINICFLOW_REFRESH_SESSION_DAYS:-30}
      CLINICFLOW_JWT_ALGORITHM: HS256
      CLINICFLOW_APP_VERSION: ${CLINICFLOW_APP_VERSION:-0.1.0}
      CLINICFLOW_BUILD_COMMIT: ${CLINICFLOW_BUILD_COMMIT:-unknown}
      CLINICFLOW_MINIMUM_MOBILE_VERSION: ${CLINICFLOW_MINIMUM_MOBILE_VERSION:-0.1.0}
      CLINICFLOW_MINIMUM_MOBILE_VERSION_CODE: ${CLINICFLOW_MINIMUM_MOBILE_VERSION_CODE:-1}
      CLINICFLOW_LATEST_MOBILE_VERSION: ${CLINICFLOW_LATEST_MOBILE_VERSION:-0.1.0}
      CLINICFLOW_LATEST_MOBILE_VERSION_CODE: ${CLINICFLOW_LATEST_MOBILE_VERSION_CODE:-1}
      CLINICFLOW_MOBILE_APK_URL: "${CLINICFLOW_MOBILE_APK_URL:-}"
      CLINICFLOW_MOBILE_APK_SHA256: "${CLINICFLOW_MOBILE_APK_SHA256:-}"
      CLINICFLOW_MOBILE_RELEASE_NOTES: "${CLINICFLOW_MOBILE_RELEASE_NOTES:-}"
      CLINICFLOW_MOBILE_UPDATE_MANDATORY: "${CLINICFLOW_MOBILE_UPDATE_MANDATORY:-false}"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    environment:
      CLINICFLOW_DOMAIN: ${CLINICFLOW_DOMAIN:?Set CLINICFLOW_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - clinicflow_caddy_data:/data
      - clinicflow_caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      edge:
      backend:
        ipv4_address: 172.30.0.10

volumes:
  clinicflow_prod_pgdata:
  clinicflow_caddy_data:
  clinicflow_caddy_config:

networks:
  edge:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
