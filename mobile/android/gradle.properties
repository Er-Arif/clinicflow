# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on configuring Gradle build environments, see:
# https://docs.gradle.org/current/userguide/build_environment.html

# Keep the JDK host-specific. CI and release hosts must provide Java 17 through
# JAVA_HOME (or their build environment) rather than checking a workstation path
# into the repository.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.workers.max=4

android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true

# Architectures may be overridden from the command line when a narrower local
# build is useful, e.g. -PreactNativeArchitectures=arm64-v8a.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Development-client tooling. It has no production permission by itself; the
# production manifest is validated separately in CI.
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

expo.useLegacyPackaging=false
expo.inlineModules.watchedDirectories=[]
