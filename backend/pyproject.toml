[project]
name = "clinicflow-backend"
version = "0.1.0"
description = "ClinicFlow V1 FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.141,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0.54,<2.1",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.16,<2.0",
  "pydantic-settings>=2.14,<3.0",
  "argon2-cffi>=25.1,<26.0",
  "PyJWT>=2.10,<3.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<10.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
