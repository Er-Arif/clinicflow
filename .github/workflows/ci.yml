name: clinicflow-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: clinicflow_test
          POSTGRES_USER: clinicflow
          POSTGRES_PASSWORD: clinicflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicflow -d clinicflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      CLINICFLOW_DATABASE_URL: postgresql+psycopg://clinicflow:clinicflow@localhost:5432/clinicflow_test
      CLINICFLOW_CLINIC_TIMEZONE: Asia/Kolkata
      CLINICFLOW_ACCESS_TOKEN_SECRET: ci-only-secret-that-is-long-enough-1234567890
      CLINICFLOW_RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:release-metadata
      - run: npm run validate:android-security
      - run: npm test

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: docker compose --env-file infra/.env.production.example -f infra/docker-compose.production.yml config --quiet
      - name: Validate backup script syntax
        run: sh -n scripts/backup_postgres.sh scripts/verify_restore.sh
      - name: Verify backup checksum tooling
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          dump="$tmp_dir/clinicflow-test.dump"
          printf 'clinicflow-backup-test\n' > "$dump"
          python3 scripts/backup_integrity.py write "$dump"
          python3 scripts/backup_integrity.py verify "$dump"
          printf 'tampered\n' >> "$dump"
          if python3 scripts/backup_integrity.py verify "$dump"; then
            echo "Tampered backup unexpectedly passed verification" >&2
            exit 1
          fi
